<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache">
<title>플레이스 검색어</title>
<style>
:root{color-scheme:light dark}
body{margin:0;background:#EDEEF1;color:#12161C;
  font-family:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){body{background:#0F1216;color:#E7EAEE}}
.gate{min-height:100svh;display:grid;place-items:center;padding:24px}
.gate-card{width:min(380px,100%);background:#FBFBFC;border:1px solid #D2D7DE;
  border-radius:8px;padding:34px 30px 28px}
@media (prefers-color-scheme:dark){.gate-card{background:#171B21;border-color:#2A313A}}
.eyebrow{margin:0;font-size:12px;letter-spacing:.06em;color:#2B3A67;font-weight:600}
@media (prefers-color-scheme:dark){.eyebrow{color:#8FA5DE}}
h1{font-size:25px;letter-spacing:-.02em;margin:6px 0 0}
.gate-note{color:#626B76;font-size:13.5px;margin:8px 0 18px}
.field{display:flex;gap:8px}
.field input{flex:1 1 auto;min-width:0;padding:11px 13px;font:inherit;
  border:1px solid #D2D7DE;border-radius:6px;background:transparent;color:inherit}
.field button{padding:11px 16px;font:inherit;font-weight:600;cursor:pointer;
  border:0;border-radius:6px;background:#2B3A67;color:#fff}
.field button[disabled]{opacity:.6;cursor:default}
.gate-error{color:#A33A28;font-size:13px;margin:13px 0 0}
</style>
</head>
<body>
<div class="gate">
  <form class="gate-card" id="gateForm">
    <p class="eyebrow">무탄 · 지강한식당</p>
    <h1>플레이스 검색어</h1>
    <p class="gate-note">비밀번호를 넣으면 표가 열립니다.</p>
    <div class="field">
      <input id="pw" type="password" autocomplete="current-password"
             placeholder="비밀번호" aria-label="비밀번호">
      <button id="unlock" type="submit">열기</button>
    </div>
    <p class="gate-error" id="gateErr" role="alert" hidden></p>
  </form>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_CACHE = "mutan-maechul-pw";

async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(BLOB.salt), iterations:BLOB.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(BLOB.iv)}, key, b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

const pwInput = document.getElementById("pw");
const unlockBtn = document.getElementById("unlock");
const gateErr = document.getElementById("gateErr");

function fail(msg){
  gateErr.textContent = msg; gateErr.hidden = false;
  unlockBtn.disabled = false; unlockBtn.textContent = "열기"; pwInput.select();
}

async function tryOpen(pw, remember){
  unlockBtn.disabled = true; unlockBtn.textContent = "여는 중"; gateErr.hidden = true;
  let html;
  try{ html = await decrypt(pw); }
  catch(e){ fail("비밀번호가 맞지 않습니다. 다시 넣어 주세요."); return false; }
  if(remember){ try{ sessionStorage.setItem(KEY_CACHE, pw); }catch(e){} }
  // 하루표는 <script>가 표를 그린다. innerHTML로는 안 돌아서 문서를 통째로 다시 쓴다.
  document.open(); document.write(html); document.close();
  return true;
}

document.getElementById("gateForm").addEventListener("submit", e => {
  e.preventDefault();
  const pw = pwInput.value;
  if(!pw){ fail("비밀번호를 넣어 주세요."); return; }
  tryOpen(pw, true);
});

(function(){
  let saved = null;
  try{ saved = sessionStorage.getItem(KEY_CACHE); }catch(e){}
  if(saved){ tryOpen(saved, false).then(ok => { if(!ok) gateErr.hidden = true; }); }
})();
</script>
