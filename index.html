<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="cache-control" content="no-cache">
</head>
<body>
<title>일별 판매량</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
:root{
  --ground:#F3F6F3; --surface:#FFFFFF; --surface-2:#F9FBF9;
  --we:#EDF2EF; --we-head:#E2EBE6; --we-line:#C7D8D0;
  --ink:#12211C; --ink-2:#3D4F48; --muted:#6E807A; --line:#DCE4E0; --line-soft:#EAEFEC;
  --accent:#1F6F5C; --accent-soft:#9FC8BB; --accent-ink:#155345; --on-accent:#FFFFFF;
  --up:#1F6F5C; --down:#B4462F;
  --shadow:0 1px 2px rgba(18,33,28,.05), 0 10px 26px -14px rgba(18,33,28,.22);
  --edge:8px 0 8px -8px rgba(18,33,28,.20);
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#0E1412; --surface:#151D1A; --surface-2:#1A2320;
    --we:#1E2A26; --we-head:#243330; --we-line:#35473F;
    --ink:#E8EEEA; --ink-2:#B9C6C0; --muted:#8B9A94; --line:#27322E; --line-soft:#1F2926;
    --accent:#5FBFA3; --accent-soft:#31604F; --accent-ink:#8FD9C2; --on-accent:#0E1412;
    --up:#5FBFA3; --down:#E4886F;
    --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 30px -16px rgba(0,0,0,.7);
    --edge:8px 0 8px -8px rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  --ground:#0E1412; --surface:#151D1A; --surface-2:#1A2320;
    --we:#1E2A26; --we-head:#243330; --we-line:#35473F;
  --ink:#E8EEEA; --ink-2:#B9C6C0; --muted:#8B9A94; --line:#27322E; --line-soft:#1F2926;
  --accent:#5FBFA3; --accent-soft:#31604F; --accent-ink:#8FD9C2; --on-accent:#0E1412;
  --up:#5FBFA3; --down:#E4886F;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 14px 30px -16px rgba(0,0,0,.7);
  --edge:8px 0 8px -8px rgba(0,0,0,.55);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:"Gothic A1","IBM Plex Sans KR",sans-serif; font-weight:800; text-wrap:balance; margin:0}
.num{font-family:"IBM Plex Mono",ui-monospace,monospace; font-variant-numeric:tabular-nums}
.eyebrow{
  font-family:"Gothic A1",sans-serif; font-weight:700; font-size:11px;
  letter-spacing:.16em; color:var(--muted); margin:0;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:4px}

/* ---------- 비밀번호 화면 ---------- */
.gate{min-height:100svh; display:grid; place-items:center; padding:24px}
.gate-card{
  width:min(380px,100%); background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r); box-shadow:var(--shadow); padding:34px 30px 28px;
  display:flex; flex-direction:column; gap:0;
}
.gate-card h1{font-size:27px; letter-spacing:-.02em; margin:6px 0 0}
.gate-note{color:var(--muted); font-size:13.5px; margin:8px 0 18px}
.field{display:flex; gap:8px}
.field input{
  flex:1 1 auto; min-width:0; padding:11px 13px; font:inherit; color:var(--ink);
  background:var(--surface-2); border:1px solid var(--line); border-radius:8px;
}
.field input::placeholder{color:var(--muted)}
.field button{
  flex:0 0 auto; padding:11px 18px; border:0; border-radius:8px; cursor:pointer;
  background:var(--accent); color:var(--on-accent);
  font-family:"Gothic A1",sans-serif; font-weight:700; font-size:14px;
}
.field button:hover{background:var(--accent-ink)}
.field button[disabled]{opacity:.55; cursor:default}
.gate-error{color:var(--down); font-size:13px; margin:13px 0 0}

/* ---------- 본문 ---------- */
.wrap{max-width:1180px; margin:0 auto; padding:24px 20px 60px}
header.top{display:flex; flex-wrap:wrap; align-items:flex-end; gap:10px 20px; margin-bottom:16px}
header.top h1{font-size:27px; letter-spacing:-.025em; margin-top:3px}
.stamp{margin-left:auto; text-align:right; color:var(--muted); font-size:12.5px; line-height:1.5}

.panel{background:var(--surface); border:1px solid var(--line); border-radius:var(--r); box-shadow:var(--shadow)}
.panel + .panel{margin-top:14px}
.panel-head{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; padding:16px 18px 0}
.panel-head h2{font-size:16px; letter-spacing:-.01em}
.panel-head .hint{color:var(--muted); font-size:12.5px; margin-right:auto}
.panel-body{padding:14px 18px 18px}

.seg{display:inline-flex; border:1px solid var(--line); border-radius:7px; overflow:hidden; margin-left:auto}
.seg button{
  border:0; background:transparent; color:var(--muted); cursor:pointer;
  font:inherit; font-size:12.5px; padding:5px 11px;
}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.search{
  padding:6px 10px; font:inherit; font-size:13px; color:var(--ink); min-width:150px;
  background:var(--surface-2); border:1px solid var(--line); border-radius:7px;
}

.scroller{overflow-x:auto; border-top:1px solid var(--line-soft); margin-top:12px}
table{border-collapse:separate; border-spacing:0; width:100%; font-size:13.5px}
th,td{padding:7px 10px; white-space:nowrap; border-bottom:1px solid var(--line-soft)}
thead th{
  position:sticky; top:0; z-index:3; background:var(--surface-2); color:var(--muted);
  font-weight:600; font-size:12px; text-align:right; border-bottom:1px solid var(--line);
}
thead th.name{text-align:left}
thead th.name,thead th.sum{z-index:4; background:var(--surface-2)}
th.name,td.name{
  position:sticky; left:0; z-index:2; background:var(--surface); text-align:left;
  max-width:186px; min-width:186px; overflow:hidden; text-overflow:ellipsis;
}
th.sum,td.sum{position:sticky; left:186px; z-index:2; background:var(--surface); text-align:right;
              font-weight:600; box-shadow:var(--edge)}
td.name{font-weight:500; color:var(--ink)}
td{text-align:right; color:var(--ink-2)}
td.zero{color:var(--muted); opacity:.45}
tbody tr:hover td{background:var(--surface-2)}
/* 주말 열. 2026-09-01까지 --surface-2(흰색 대비 1%)라 사실상 안 보였다.
   외식업은 요일이 제일 큰 변수라 눈에 걸려야 한다. */
td.we{background:var(--we)}
thead th.we{background:var(--we-head)}
tbody tr:hover td.we{background:var(--we-head)}
/* 주말 덩어리의 시작·끝에만 선을 그어 한 묶음으로 읽히게 한다.
   폰에서는 날짜 열이 두 개뿐이라 토·일이 같이 안 보일 때가 많다 —
   그래서 요일 글자에도 색을 줘, 열 하나만 보여도 주말인 게 보이게 한다. (2026-09-01) */
th.we-s,td.we-s{border-left:1px solid var(--we-line)}
th.we-e,td.we-e{border-right:1px solid var(--we-line)}
thead th .wd{display:inline-block}
thead th.we .wd{color:var(--accent-ink); font-weight:800}
tfoot td{font-weight:700; color:var(--ink); border-top:1px solid var(--line); border-bottom:0; background:var(--surface)}
.spark{display:block; margin:0 auto}
th.trend,td.trend{min-width:96px; text-align:center; padding-left:12px; padding-right:12px}
.sortable{cursor:pointer; user-select:none}
.sortable[aria-sort="descending"]::after{content:" \2193"; color:var(--accent)}
.sortable[aria-sort="ascending"]::after{content:" \2191"; color:var(--accent)}
.empty{padding:26px 12px; text-align:center; color:var(--muted); font-size:13.5px}

/* ---------- 메뉴별 분석 ---------- */
.lede{margin:0 0 4px; font-size:14px; color:var(--ink-2); line-height:1.6}
.lede b{color:var(--ink); font-weight:600}
.cap{margin:0 0 14px; font-size:12px; color:var(--muted)}
/* 매장별 TOP 5. 폰에서는 한 줄에 하나씩, 넓으면 나란히 (2026-08-31) */
/* 브랜드 고르는 칸은 기간 버튼보다 확실히 크게. 이걸 못 보면 다른 브랜드가
   있다는 것 자체를 모른다 (2026-08-31 도경님). */
.brands{margin-top:14px; margin-left:0; border-radius:10px; border-color:var(--accent)}
.brands button{
  font-size:16px; font-weight:600; padding:11px 26px; letter-spacing:-.01em;
  color:var(--ink-2);
}
.brands button + button{border-left:1px solid var(--line)}
.brands button[aria-pressed="true"]{background:var(--accent); color:var(--on-accent)}
.stores{display:grid; grid-template-columns:repeat(auto-fit, minmax(260px, 1fr)); gap:14px}
.store h3{margin:0 0 8px; font-size:14px; display:flex; align-items:baseline; gap:8px}
.store h3 .tot{color:var(--muted); font-size:12px; font-weight:400}
table.mini{font-size:13px}
table.mini th{color:var(--muted); font-weight:500; text-align:left; padding:4px 6px;
  border-bottom:1px solid var(--line); white-space:nowrap}
table.mini td{padding:5px 6px; border-bottom:1px solid var(--line)}
table.mini th.num, table.mini td.num{text-align:right}
/* 위 표의 td{text-align:right}를 물려받아 메뉴명이 오른쪽에 붙었다 (2026-08-31) */
table.mini td.nm{text-align:left; color:var(--ink)}
table.mini td.nm{max-width:0; width:99%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
table.mini tr:last-child td{border-bottom:0}
.cols{display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:14px 22px}
.col h3{
  font-family:"Gothic A1",sans-serif; font-size:12px; font-weight:700; color:var(--muted);
  letter-spacing:.04em; margin:0 0 7px; padding-bottom:6px; border-bottom:1px solid var(--line-soft);
}
.col ol{list-style:none; margin:0; padding:0}
.col li{display:flex; align-items:baseline; gap:10px; padding:5px 0; font-size:13.5px}
.col li .nm{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.col li .dv{flex:0 0 auto; font-weight:600}
.col li .base{flex:0 0 auto; color:var(--muted); font-size:12px}
.dv.up{color:var(--up)} .dv.down{color:var(--down)}

.notes{margin-top:16px; padding-top:12px; border-top:1px solid var(--line-soft)}
.notes p{margin:0 0 6px; font-size:12.5px; color:var(--muted); line-height:1.65}
.notes p:last-child{margin-bottom:0}
.notes p::before{content:"※ "; color:var(--accent)}
footer.note{margin-top:20px; color:var(--muted); font-size:12px; line-height:1.7}
@media (prefers-reduced-motion: reduce){*{transition:none !important; animation:none !important}}
@media (max-width:560px){
  :root{--we:#E3EDE8; --we-head:#D6E4DD}
  body{font-size:14px}
  .wrap{padding:18px 12px 48px}
  th.name,td.name{max-width:124px; min-width:124px}
  th.sum,td.sum{left:124px}
  th,td{padding:7px 8px}
  table{font-size:12.5px}
  header.top{gap:4px 12px; margin-bottom:12px}
  header.top h1{font-size:23px}
  .stamp{flex:1 0 100%; margin-left:0; text-align:left}
  .panel-head{padding:14px 13px 0; gap:8px}
  .panel-head .hint{display:none}
  .panel-body{padding:12px 13px 15px}
  .search{flex:1 1 120px; min-width:0}
  .seg{margin-left:0}
  /* 폰에서도 브랜드 이름이 제일 먼저 눈에 들어와야 한다 (2026-08-31 도경님).
     화면 너비를 반씩 나눠 갖고, 글씨는 데스크톱보다 오히려 크게.

     header.top이 flex라 브랜드 칸을 감싼 div가 내용만큼만 줄어들고, 그 안에서
     width:100%가 159px로 잡혀 '지강한식당'이 세 줄로 접혔다(버튼 높이 86px).
     감싼 div를 한 줄 통째로 쓰게 하고 버튼은 줄바꿈을 막는다. */
  header.top > div:first-child{flex:1 1 100%; min-width:0}
  .brands{display:flex; width:100%; margin-top:12px}
  .brands button{
    flex:1 1 0; min-width:0; white-space:nowrap;
    font-size:18px; padding:14px 4px; text-align:center;
  }
  .scroller{-webkit-overflow-scrolling:touch}
  footer.note{font-size:11.5px}
}
</style>

<div class="gate" id="gate">
  <form class="gate-card" id="gateForm">
    <p class="eyebrow">무탄 · 지강한식당</p>
    <h1>일별 판매량</h1>
    <p class="gate-note">비밀번호를 넣으면 표가 열립니다.</p>
    <div class="field">
      <input id="pw" type="password" inputmode="numeric" autocomplete="current-password" placeholder="비밀번호" aria-label="비밀번호">
      <button id="unlock" type="submit">열기</button>
    </div>
    <p class="gate-error" id="gateErr" role="alert" hidden></p>
  </form>
</div>

<main class="wrap" id="app" hidden>
  <header class="top">
    <div>
      <p class="eyebrow" id="sub"></p>
      <h1>일별 판매량</h1>
      <div class="seg brands" id="brands" role="group" aria-label="브랜드" hidden></div>
    </div>
    <div class="stamp" id="stamp"></div>
  </header>

  <section class="panel">
    <div class="panel-head">
      <span class="hint">최근 날짜와 추이가 먼저 보입니다 · 옆으로 밀면 지난 날짜 · 머리글을 누르면 정렬</span>
      <input class="search" id="q" type="search" placeholder="메뉴 찾기" aria-label="메뉴 찾기">
      <div class="seg" id="range" role="group" aria-label="보는 기간">
        <button type="button" data-days="7" aria-pressed="true">최근 7일</button>
        <button type="button" data-days="0" aria-pressed="false">전체</button>
      </div>
    </div>
    <div class="scroller main"><table id="tbl"></table></div>
    <div class="empty" id="empty" hidden>찾는 메뉴가 없습니다.</div>
  </section>

  <section class="panel" id="storePanel" hidden>
    <div class="panel-head"><h2>매장별 TOP 5</h2><span class="hint" id="storeSpan"></span></div>
    <div class="panel-body"><div class="stores" id="stores"></div></div>
  </section>

  <section class="panel">
    <div class="panel-head"><h2>메뉴별 분석</h2></div>
    <div class="panel-body" id="analysis"></div>
  </section>

  <!-- 한 매장만 따로 보는 표. 어느 매장인지는 payload의 focus가 정한다 (2026-09-14 도경님:
       지강 하남이 최근 변경이 많아 당분간 더 잘 관리하려고). 위 표와 같은 모양·같은 기간. -->
  <section class="panel" id="focusPanel" hidden>
    <div class="panel-head"><h2 id="focusTitle"></h2><span class="hint" id="focusHint"></span></div>
    <div class="scroller focus"><table id="focusTbl"></table></div>
    <div class="empty" id="focusEmpty" hidden>찾는 메뉴가 없습니다.</div>
    <p class="cap" id="focusNote" style="margin:0; padding:12px 18px 16px"></p>
  </section>

  <!-- 1.5배 메뉴만 따로 본 표 (2026-11-17 도경님: 기존 메뉴에 넣고, 하단에 1.5배는 별도로).
       위 표의 치즈닭갈비 등에 이미 더해져 있다 — 합계에 다시 더하지 않는 참고 표다. payload.half -->
  <section class="panel" id="halfPanel" hidden>
    <div class="panel-head"><h2 id="halfTitle"></h2><span class="hint" id="halfHint"></span></div>
    <div class="scroller focus half"><table id="halfTbl"></table></div>
    <div class="empty" id="halfEmpty" hidden>찾는 메뉴가 없습니다.</div>
    <p class="cap" style="margin:0; padding:12px 18px 16px">1.5배(닭다리살 1.5배) 메뉴만 다시 적은 표입니다. 위 표의 치즈닭갈비·투움바치즈닭갈비·치즈낙지닭갈비·나폴리탄치즈닭갈비에 이미 들어가 있어서, 위 합계에 더하지 않습니다. 3개 매장 합입니다.</p>
  </section>

  <footer class="note" id="foot"></footer>
</main>

<script>
/* 아티팩트가 <head>를 대신 만들기 때문에 파일 안에 meta를 쓸 수 없다.
   폰에서 데스크톱 폭(980px)으로 그려지는 것을 막고, '홈 화면에 추가'했을 때
   아이콘·이름이 제대로 잡히게 실행 시점에 붙인다. (2026-08-24) */
(function(){
  function head(tag, attrs){
    for(const k in attrs){
      const sel = tag + '[' + k + '="' + attrs[k] + '"]';
      if(k !== 'content' && document.head.querySelector(sel)) return;
    }
    const el = document.createElement(tag);
    for(const k in attrs) el.setAttribute(k, attrs[k]);
    document.head.appendChild(el);
  }
  let vp = document.head.querySelector('meta[name="viewport"]');
  if(!vp){ vp = document.createElement("meta"); vp.name = "viewport"; document.head.appendChild(vp); }
  vp.setAttribute("content", "width=device-width, initial-scale=1, viewport-fit=cover");

  head("meta", {name:"apple-mobile-web-app-capable", content:"yes"});
  head("meta", {name:"mobile-web-app-capable", content:"yes"});
  head("meta", {name:"apple-mobile-web-app-title", content:"일별 판매량"});
  head("meta", {name:"apple-mobile-web-app-status-bar-style", content:"black-translucent"});
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  head("meta", {name:"theme-color", content: dark ? "#0E1412" : "#F3F6F3"});

  // 홈 화면 아이콘. iOS는 SVG를 안 받아서 캔버스로 PNG를 만들어 붙인다.
  function icon(size){
    const c = document.createElement("canvas");
    c.width = c.height = size;
    const g = c.getContext("2d");
    g.fillStyle = "#1F6F5C";
    g.fillRect(0, 0, size, size);
    g.fillStyle = "#FFFFFF";
    g.textAlign = "center";
    g.textBaseline = "middle";
    g.font = "700 " + Math.round(size * 0.38) + 'px "Gothic A1", sans-serif';
    g.fillText("판매", size / 2, size * 0.42);
    g.font = "500 " + Math.round(size * 0.17) + 'px "IBM Plex Sans KR", sans-serif';
    g.fillText("판매량", size / 2, size * 0.74);
    return c.toDataURL("image/png");
  }
  try{
    const i180 = icon(180), i512 = icon(512);
    head("link", {rel:"apple-touch-icon", href:i180});
    head("link", {rel:"icon", type:"image/png", href:i180});
    const manifest = {
      name:"무탄·지강 일별 판매량", short_name:"일별 판매량",
      display:"standalone", start_url:location.href, scope:location.href,
      background_color: dark ? "#0E1412" : "#F3F6F3",
      theme_color:"#1F6F5C",
      icons:[{src:i180, sizes:"180x180", type:"image/png"},
             {src:i512, sizes:"512x512", type:"image/png"}]
    };
    head("link", {rel:"manifest",
      href:"data:application/manifest+json," + encodeURIComponent(JSON.stringify(manifest))});

/* ---------- 잠금 해제 ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
const KEY_CACHE = "mutan-sales-pw";

async function decrypt(pw){
  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey("raw", enc.encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    {name:"PBKDF2", salt:b64(BLOB.salt), iterations:BLOB.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(BLOB.iv)}, key, b64(BLOB.ct));
  return JSON.parse(new TextDecoder().decode(plain));
}

const gate = document.getElementById("gate");
const gateForm = document.getElementById("gateForm");
const pwInput = document.getElementById("pw");
const unlockBtn = document.getElementById("unlock");
const gateErr = document.getElementById("gateErr");

function fail(msg){
  gateErr.textContent = msg;
  gateErr.hidden = false;
  unlockBtn.disabled = false;
  unlockBtn.textContent = "열기";
  pwInput.select();
}

async function tryOpen(pw, remember){
  unlockBtn.disabled = true;
  unlockBtn.textContent = "여는 중";
  gateErr.hidden = true;
  let data;
  try{ data = await decrypt(pw); }
  catch(e){ fail("비밀번호가 맞지 않습니다. 다시 넣어 주세요."); return false; }
  if(remember){ try{ sessionStorage.setItem(KEY_CACHE, pw); }catch(e){} }
  gate.remove();
  document.getElementById("app").hidden = false;
  renderApp(data);
  return true;
}

gateForm.addEventListener("submit", e => {
  e.preventDefault();
  const pw = pwInput.value;
  if(!pw){ fail("비밀번호를 넣어 주세요."); return; }
  tryOpen(pw, true);
});

(function(){
  let saved = null;
  try{ saved = sessionStorage.getItem(KEY_CACHE); }catch(e){}
  if(saved){
    tryOpen(saved, false).then(ok => {
      if(!ok){
        try{ sessionStorage.removeItem(KEY_CACHE); }catch(e){}
        gateErr.hidden = true;
        pwInput.focus();
      }
    });
  } else {
    pwInput.focus();
  }
})();

/* ---------- 그리기 ---------- */
const nf = n => n.toLocaleString("ko-KR");
const WD = ["월","화","수","목","금","토","일"];
const dow = d => (new Date(d + "T00:00:00").getDay() + 6) % 7;
const isWeekend = d => dow(d) >= 5;
/* 주말 열에 붙일 클래스. 덩어리의 첫 열과 끝 열을 따로 표시한다. */
function weCls(dates, i){
  if(!isWeekend(dates[i])) return "";
  let c = " we";
  if(i === 0 || !isWeekend(dates[i-1])) c += " we-s";
  if(i === dates.length-1 || !isWeekend(dates[i+1])) c += " we-e";
  return c;
}
const wdOf = d => WD[dow(d)];
const mmdd = d => d.slice(5).replace("-", "/");
const round1 = n => n.toFixed(1);   // "+4"가 아니라 "+4.0" - 소수 자리가 붙어야 세로로 읽힌다

let ALL = null, DATA = null, days = 7, query = "";
/* 정렬 상태는 표마다 따로. MS = 위 본문 표, FS = 맨 아래 한 매장 표 (2026-09-14) */
const MS = {k: "sum", d: -1}, FS = {k: "sum", d: -1}, HS = {k: "sum", d: -1};   // HS = 1.5배 표 (2026-11-17)
// 표를 그린 뒤 최신 날짜 쪽(오른쪽 끝)으로 보낼지. 폰에서는 날짜 두 칸밖에 안 보여서
// 그냥 두면 제일 오래된 날부터 보인다. 정렬·검색으로 다시 그릴 때는 보던 자리를 지킨다.
let jumpToEnd = true;

function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"})[c]);
}

/* 한 페이지에 브랜드가 여럿 들어 있다 (2026-08-31 도경님).
   주소에 ?b=지강 을 붙이면 그 브랜드가 골라진 채로 열린다. 브랜드를 바꾸면 주소창도
   같이 바뀌므로, 보고 있는 화면을 그대로 링크로 보낼 수 있다.
   예전 주소 /jigang/ 은 여기로 넘겨준다 - 이미 받아 간 링크가 깨지면 안 된다. */
function brandKeyFromUrl(){
  try{
    const v = new URLSearchParams(location.search).get("b");
    if(!v) return null;
    const hit = ALL.brands.find(x => x.key === v || x.label === v
      || x.key.toLowerCase() === v.toLowerCase());
    return hit ? hit.key : null;
  }catch(e){ return null; }
}

function pickBrand(key, push){
  const b = ALL.brands.find(x => x.key === key) || ALL.brands[0];
  if(push){
    try{
      const u = new URL(location.href);
      u.searchParams.set("b", b.key);
      history.replaceState(null, "", u);
    }catch(e){}
  }
  document.querySelectorAll("#brands button").forEach(x =>
    x.setAttribute("aria-pressed", x.dataset.b === b.key ? "true" : "false"));
  // 브랜드를 바꾸면 정렬·검색은 그대로 두되 날짜 정렬만 푼다 (열 수가 다를 수 있다)
  for(const s of [MS, FS, HS]) if(typeof s.k === "number"){ s.k = "sum"; s.d = -1; }
  jumpToEnd = true;
  render(b);
}

function renderApp(all){
  ALL = all;
  const box = document.getElementById("brands");
  if(all.brands.length > 1){
    box.hidden = false;
    box.innerHTML = all.brands.map(b =>
      '<button type="button" data-b="' + escapeHtml(b.key) + '" aria-pressed="false">'
      + escapeHtml(b.label) + '</button>').join("");
    box.addEventListener("click", e => {
      const btn = e.target.closest("button");
      if(btn) pickBrand(btn.dataset.b, true);
    });
  }
  pickBrand(brandKeyFromUrl() || all.brands[0].key, false);
}

function render(data){

  document.getElementById("sub").textContent = data.sub || "";

    + escapeHtml(data.generated) + " 기준";

  document.getElementById("foot").innerHTML = data.foot || "";

  buildTable();
  buildStores();
  buildAnalysis();
  buildFocus();
  buildHalf();
}

function sparkline(vals){
  const w = 78, h = 22;
  if(vals.length < 2) return "";
  const max = Math.max.apply(null, vals.concat([1]));
  const pts = vals.map((v, i) => ((i/(vals.length-1))*(w-2)+1) + "," + (h-1-(v/max)*(h-3))).join(" ");
  const lx = w - 1, ly = h - 1 - (vals[vals.length-1]/max)*(h-3);
  return '<svg class="spark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '" aria-hidden="true">'
       + '<polyline points="' + pts + '" fill="none" stroke="var(--accent)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>'
       + '<circle cx="' + lx + '" cy="' + ly + '" r="2.2" fill="var(--accent)"/></svg>';
}

/* 매장별 TOP 5. 위쪽 '최근 7일 / 전체' 버튼을 그대로 따라간다 - 한 화면에 두 기간이
   섞이면 보는 사람이 어느 기간 숫자인지 헷갈린다. 그래서 머리에 기간을 같이 적는다.
   비율은 **그 매장 전체 대비**다 (전 매장 합계가 아니다). (2026-08-31 도경님 요청) */
function buildStores(){
  const panel = document.getElementById("storePanel");
  const list = DATA.stores || [];
  if(!list.length){ panel.hidden = true; return; }   // 무탄은 매장별 탭이 없다
  panel.hidden = false;

  const from = days > 0 ? Math.max(0, DATA.dates.length - days) : 0;
  const dates = DATA.dates.slice(from);
  document.getElementById("storeSpan").textContent =
    mmdd(dates[0]) + "~" + mmdd(dates[dates.length - 1]) + " · " + dates.length + "일";

  document.getElementById("stores").innerHTML = list.map(st => {
    const rows = st.items
      .filter(it => !it.x)   /* 합계 제외 품목(지강 사이드)은 TOP 5·비율에서 뺀다 */
      .map(it => ({n: it.n, sum: it.v.slice(from).reduce((a,b) => a + b, 0)}))
      .filter(r => r.sum > 0)
      .sort((a,b) => b.sum - a.sum);
    const total = rows.reduce((s2, r) => s2 + r.sum, 0);
    if(!total){
      return '<div class="store"><h3>' + escapeHtml(st.name) + '</h3>'
           + '<p class="cap" style="margin:0">이 기간에 판매 없음</p></div>';
    }
    return '<div class="store"><h3>' + escapeHtml(st.name)
      + '<span class="tot num">' + nf(total) + '</span></h3>'
      + '<table class="mini"><thead><tr><th>메뉴명</th>'
      + '<th class="num">' + escapeHtml(DATA.qty || '판매량') + '</th>'
      + '<th class="num">비율</th></tr></thead><tbody>'
      + rows.slice(0, 5).map(r =>
          '<tr><td class="nm">' + escapeHtml(r.n) + '</td>'
          + '<td class="num">' + nf(r.sum) + '</td>'
          + '<td class="num">' + (r.sum / total * 100).toFixed(1) + '%</td></tr>').join("")
      + '</tbody></table></div>';
  }).join("");
}

/* 폰에서 오른쪽 끝으로 보내면 날짜 열 하나가 고정된 '메뉴·합계' 열 밑에 반쯤
   깔린다. 앞자리가 가려져 203이 03으로, 131이 31로 읽혔다(2026-09-01 확인).
   끝으로 보낸 뒤 그 열이 통째로 드러나는 자리까지 되돌린다.
   대신 오른쪽 끝의 '추이'가 조금 잘릴 수 있는데, 그림이라 숫자보다 덜 아프다. */
function snapPastSticky(sc){
  const sum = sc.querySelector("thead th.sum");
  if(!sum) return;
  const base = sc.getBoundingClientRect().left;
  const edge = sum.getBoundingClientRect().right - base;
  for(const th of sc.querySelectorAll("thead th.sortable:not(.name):not(.sum)")){
    const r = th.getBoundingClientRect();
    const left = r.left - base;
    if(left < edge - 0.5 && left + r.width > edge + 0.5){
      sc.scrollLeft -= (edge - left);
      return;
    }
  }
}

/* 일별 표 HTML. items는 {n, v, x} 목록, st는 정렬 상태 {k, d}. 검색어는 두 표에 같이 건다. */
function dailyHtml(items, dates, from, st){
  const sortKey = st.k, sortDir = st.d;
  const rows = items
    .map(it => { const v = it.v.slice(from);
                 return {n: it.n, v: v, x: it.x, sum: v.reduce((a,b) => a + b, 0)}; })
    .filter(r => !query || r.n.toLowerCase().indexOf(query) >= 0);

  rows.sort((a,b) => {
    if(sortKey === "name") return a.n.localeCompare(b.n, "ko") * -sortDir;
    if(sortKey === "sum") return (a.sum - b.sum) * sortDir;
    return (a.v[sortKey] - b.v[sortKey]) * sortDir || (a.sum - b.sum) * sortDir;
  });

  /* x가 붙은 줄(지강 감자파튀·어린이메뉴)은 표에는 보이지만 합계에서 뺀다 */
  const colTotals = dates.map((_, i) => rows.reduce((s, r) => s + (r.x ? 0 : r.v[i]), 0));
  const grand = colTotals.reduce((a,b) => a + b, 0);
  const aria = k => sortKey === k ? (sortDir < 0 ? "descending" : "ascending") : "none";

  let h = '<thead><tr><th scope="col" class="name sortable" data-k="name" aria-sort="' + aria("name") + '">메뉴</th>'
        + '<th scope="col" class="sum sortable" data-k="sum" aria-sort="' + aria("sum") + '">합계</th>';
  dates.forEach((d, i) => {
    h += '<th scope="col" class="sortable' + weCls(dates, i) + '" data-k="' + i + '" aria-sort="'
       + aria(i) + '">' + mmdd(d) + '<br><span class="wd">' + wdOf(d) + "</span></th>";
  });
  h += '<th scope="col" class="trend">추이</th></tr></thead><tbody>';

  rows.forEach(r => {
    /* 2026-09-07 도경님: 이름 옆 「합계 제외」 배지는 뺀다. 합계에서 빼는 동작은 그대로. */
    h += '<tr><td class="name" title="' + escapeHtml(r.n) + '">' + escapeHtml(r.n) + "</td>"
       + '<td class="sum num">' + nf(r.sum) + "</td>";
    r.v.forEach((v, i) => {
      h += '<td class="num' + (v ? "" : " zero") + weCls(dates, i) + '">' + (v ? nf(v) : "·") + "</td>";
    });
    h += '<td class="trend">' + sparkline(r.v) + "</td></tr>";
  });
  h += '</tbody><tfoot><tr><td class="name">합계</td><td class="sum num">' + nf(grand) + "</td>"
     + colTotals.map((t, i) => '<td class="num' + weCls(dates, i) + '">' + nf(t) + "</td>").join("")
     + '<td class="trend"></td></tr></tfoot>';
  return {html: rows.length ? h : "", n: rows.length};
}

/* 표를 칸에 넣고 스크롤·정렬 클릭을 건다. jump가 참이면 최신 날짜(오른쪽 끝)로 보낸다. */
function placeDaily(items, tblId, emptyId, scSel, st, redraw, jump){
  const from = days > 0 ? Math.max(0, DATA.dates.length - days) : 0;
  const dates = DATA.dates.slice(from);
  const r = dailyHtml(items, dates, from, st);
  const sc = document.querySelector(scSel);
  const keep = sc.scrollLeft;
  const tbl = document.getElementById(tblId);
  tbl.innerHTML = r.html;
  document.getElementById(emptyId).hidden = r.n > 0;
  requestAnimationFrame(() => {
    sc.scrollLeft = jump ? sc.scrollWidth : keep;
    if(jump) snapPastSticky(sc);
  });
  tbl.querySelectorAll(".sortable").forEach(th => {
    th.addEventListener("click", () => {
      const raw = th.dataset.k;
      const k = (raw === "name" || raw === "sum") ? raw : +raw;
      if(k === st.k) st.d *= -1; else { st.k = k; st.d = -1; }
      redraw();
    });
  });
  return dates;
}

function buildTable(){
  const jump = jumpToEnd;
  placeDaily(DATA.items, "tbl", "empty", ".scroller.main", MS, buildTable, jump);
  // 같은 턴에 뒤이어 그리는 표(buildFocus)도 이 값을 읽어야 하므로 그린 뒤에 내린다
  requestAnimationFrame(() => { jumpToEnd = false; });
}

/* 한 매장만 다시 적은 표. 위 표(전 매장 합계)는 그대로 두고 아래에 따로 둔다.
   2026-09-14 도경님: 지강 하남이 최근 변경이 많아 당분간 더 잘 관리하려는 것.
   어느 매장인지는 payload의 focus(빌드 쪽 BRAND_TEXT.FOCUS_STORE)가 정한다. */
function buildFocus(){
  const panel = document.getElementById("focusPanel");
  const st = (DATA.stores || []).find(s => s.name === DATA.focus);
  if(!DATA.focus || !st){ panel.hidden = true; return; }
  panel.hidden = false;
  document.getElementById("focusTitle").textContent =
    (DATA.label || "") + " " + DATA.focus + "점만 (별도)";
  document.getElementById("focusNote").textContent = DATA.focusNote || "";
  const dates = placeDaily(st.items, "focusTbl", "focusEmpty", ".scroller.focus", FS, buildFocus, jumpToEnd);
  document.getElementById("focusHint").textContent =
    mmdd(dates[0]) + "~" + mmdd(dates[dates.length - 1]) + " · " + dates.length + "일 · "
    + escapeHtml(DATA.qty || "판매량");
}

/* 1.5배만 다시 적은 표. 위 표에 이미 들어가 있는 참고 표라 합계에 안 더한다 (2026-11-17). */
function buildHalf(){
  const panel = document.getElementById("halfPanel");
  const items = DATA.half || [];
  if(!items.length){ panel.hidden = true; return; }
  panel.hidden = false;
  document.getElementById("halfTitle").textContent = (DATA.label || "") + " 1.5배 (참고)";
  const dates = placeDaily(items, "halfTbl", "halfEmpty", ".scroller.half", HS, buildHalf, jumpToEnd);
  document.getElementById("halfHint").textContent =
    mmdd(dates[0]) + "~" + mmdd(dates[dates.length - 1]) + " · " + dates.length + "일 · "
    + escapeHtml(DATA.qty || "판매량");
}

/* 최근 7일 하루 평균을 그 **직전 7일**과 견준다.

   '그 앞 전부'와 비교하면 날짜가 쌓일수록 기준 구간이 길어져서, 몇 달 전 하루
   평균과 이번 주를 견주게 된다. 7일 대 7일로 고정하면 기준이 늘 같은 길이이고,
   한 번 생긴 왜곡도 2주가 지나면 저절로 빠져나간다.
   건수가 아니라 하루 평균으로 보는 것은 두 구간의 날 수가 다를 수 있어서다. */
function buildAnalysis(){
  const el = document.getElementById("analysis");
  const dates = DATA.dates, n = dates.length;
  const recN = Math.min(7, n - 1);
  if(n < 4 || recN < 2){ el.innerHTML = '<p class="cap">비교할 날짜가 모자랍니다</p>'; return; }
  const cut = n - recN;
  const prevN = Math.min(7, cut), prevFrom = cut - prevN;

  const stats = DATA.items.map(it => {
    const total = it.v.reduce((a,b) => a + b, 0);
    const rec = it.v.slice(cut).reduce((a,b) => a + b, 0) / recN;
    const prev = it.v.slice(prevFrom, cut).reduce((a,b) => a + b, 0) / prevN;
    return {n: it.n, total: total, rec: rec, prev: prev, d: rec - prev};
  });

  const grand = stats.reduce((s, x) => s + x.total, 0);
  const byTotal = stats.slice().sort((a,b) => b.total - a.total);
  const top5 = byTotal.slice(0, 5);
  const share = Math.round(top5.reduce((s, x) => s + x.total, 0) / grand * 100);

  // 하루 한두 개 팔리는 메뉴가 증감률 상위를 차지하지 않게 잔챙이는 뺀다
  const meaningful = stats.filter(x => x.total >= 20);
  const byDelta = meaningful.slice().sort((a,b) => b.d - a.d);
  const ups = byDelta.filter(x => x.d > 0.4).slice(0, 3);
  const downs = byDelta.filter(x => x.d < -0.4).reverse().slice(0, 3);

  const lines = (arr, cls) => arr.length
    ? '<ol>' + arr.map(x =>
        '<li><span class="nm">' + escapeHtml(x.n) + '</span>'
        + '<span class="dv ' + cls + ' num">' + (x.d > 0 ? "+" : "−") + round1(Math.abs(x.d)) + '</span>'
        + '<span class="base num">' + round1(x.prev) + " → " + round1(x.rec) + '</span></li>').join("") + '</ol>'
    : '<p class="cap" style="margin:0">없음</p>';

  el.innerHTML =
    '<p class="lede"><b>잘 나가는 5개가 전체의 <span class="num">' + share + '%</span></b> — '
      + top5.map(x => escapeHtml(x.n) + ' <span class="num">' + nf(x.total) + '</span>').join(" · ") + '</p>'
    + '<p class="cap">최근 ' + recN + '일(' + mmdd(dates[cut]) + '~' + mmdd(dates[n-1]) + ')과 '
      + '그 앞 ' + prevN + '일(' + mmdd(dates[prevFrom]) + '~' + mmdd(dates[cut-1]) + ') 비교 · 하루 평균</p>'
    + '<div class="cols">'
    + '<div class="col"><h3>더 팔림</h3>' + lines(ups, "up") + '</div>'
    + '<div class="col"><h3>덜 팔림</h3>' + lines(downs, "down") + '</div>'
    + '</div>'
    + ((DATA.notes || []).length
        ? '<div class="notes">' + DATA.notes.map(t => '<p>' + escapeHtml(t) + '</p>').join("") + '</div>'
        : "");
}

document.getElementById("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  buildTable();
  buildFocus();              // 검색어는 아래 한 매장 표에도 같이 건다
  buildHalf();
});
document.getElementById("range").addEventListener("click", e => {
  const b = e.target.closest("button");
  if(!b) return;
  days = +b.dataset.days;
  document.querySelectorAll("#range button").forEach(x => x.setAttribute("aria-pressed", x === b ? "true" : "false"));
  for(const s of [MS, FS, HS]) if(typeof s.k === "number"){ s.k = "sum"; s.d = -1; }
  jumpToEnd = true;          // 기간을 바꾸면 다시 최신 날짜부터 보여준다
  buildTable();
  buildStores();             // TOP 5도 같은 기간을 본다
  buildFocus();              // 한 매장 표도 같은 기간
  buildHalf();
});
</script>
